<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cassa Bar Baseball</title>
  
  <!-- Tailwind CSS per la grafica responsive -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome per le icone -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Disabilita lo zoom su doppio tap e selezioni accidentali di testo */
    button, div { 
      touch-action: manipulation; 
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans select-none">

  <!-- CONFIGURAZIONE BACKEND (Inserisci il tuo URL qui) -->
  <script>
    // Incolla qui l'URL dell'API generata dal deploy di Google Apps Script
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwSUDM4qiukWx7a4QyOnRYZHVCBxmkjL-J5dnDnUsCgdcl9N1HI_LK57-SWNbdcwBCU/exec";
  </script>

  <!-- HEADER -->
  <header class="bg-blue-800 text-white p-3 shadow-md flex justify-between items-center shrink-0">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-baseball text-xl text-amber-400"></i>
      <h1 class="font-bold text-lg leading-none">Bar Baseball</h1>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="caricaProdotti()" class="text-xs bg-blue-700 hover:bg-blue-600 text-white py-1.5 px-2.5 rounded-lg font-semibold flex items-center gap-1 active:scale-95 transition">
        <i class="fa-solid fa-rotate" id="icon-sync"></i>
        <span>Aggiorna</span>
      </button>
      <button onclick="resetCarrello()" class="text-xs bg-red-600 hover:bg-red-700 text-white py-1.5 px-2.5 rounded-lg font-semibold active:scale-95 transition">
        Azzera
      </button>
    </div>
  </header>

  <!-- LISTA PRODOTTI (Area Scrollabile) -->
  <main id="lista-prodotti" class="flex-1 overflow-y-auto p-3 space-y-4 pb-36">
    <div class="flex flex-col items-center justify-center h-48 text-gray-500">
      <i class="fa-solid fa-spinner fa-spin text-3xl mb-2 text-blue-600"></i>
      <p class="text-sm">Caricamento prodotti e giacenze...</p>
    </div>
  </main>

  <!-- BARRA INFERIORE / CARRELLO (Fisso in basso) -->
  <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-xl p-3 flex flex-col space-y-2 z-40">
    
    <!-- Anteprima scontrino corrente -->
    <div id="anteprima-carrello" class="flex gap-2 overflow-x-auto py-1 text-xs text-gray-600 min-h-[32px] items-center">
      <span class="italic text-gray-400">Nessun articolo nel carrello</span>
    </div>

    <!-- Totale e Bottone Incassa -->
    <div class="flex items-center justify-between gap-3">
      <div>
        <span class="text-[10px] text-gray-500 uppercase font-bold tracking-wider block">Totale</span>
        <div id="totale-display" class="text-2xl font-black text-green-600">€ 0,00</div>
      </div>
      <button onclick="apriCassa()" id="btn-incassa" disabled class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-lg text-center text-lg disabled:opacity-30 disabled:cursor-not-allowed active:scale-98 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-cash-register"></i>
        <span>INCASSA</span>
      </button>
    </div>
  </footer>

  <!-- MODAL RIEPILOGO & VENDITA -->
  <div id="modal-cassa" class="fixed inset-0 bg-black/60 hidden items-end sm:items-center justify-center p-0 sm:p-4 z-50 backdrop-blur-sm">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-4 flex flex-col max-h-[90vh] shadow-2xl">
      <div class="flex justify-between items-center border-b pb-3 mb-2">
        <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
          <i class="fa-solid fa-receipt text-blue-600"></i> Riepilogo Scontrino
        </h3>
        <button onclick="chiudiModal()" class="text-gray-400 hover:text-gray-600 text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <!-- Lista articoli con tasti + / - -->
      <div id="dettaglio-ordine" class="overflow-y-auto flex-1 divide-y text-sm mb-3 max-h-56">
        <!-- Generato via JavaScript -->
      </div>

      <!-- Totale -->
      <div class="bg-gray-50 p-3 rounded-xl mb-4 border border-gray-100">
        <div class="flex justify-between items-center font-bold text-lg text-gray-800">
          <span>Totale da Pagare:</span>
          <span id="modal-totale" class="text-2xl text-green-600 font-black">€ 0,00</span>
        </div>
      </div>

      <!-- Pulsanti Conferma / Annulla -->
      <div class="flex flex-col gap-2">
        <button onclick="concludiOrdine()" id="btn-conferma" class="w-full bg-green-600 hover:bg-green-700 text-white py-3.5 rounded-xl font-bold text-lg active:scale-98 transition shadow-md flex items-center justify-center gap-2">
          <i class="fa-solid fa-check"></i>
          <span>CONFERMA E SALVA</span>
        </button>
        <button onclick="chiudiModal()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 py-2.5 rounded-xl font-semibold text-sm">
          Torna Indietro
        </button>
      </div>
    </div>
  </div>

  <!-- LOGICA JAVASCRIPT -->
  <script>
    let listinoProdotti = [];
    let carrello = {};

    // Inizializzazione
    document.addEventListener('DOMContentLoaded', () => {
      caricaProdotti();
    });

    // Feedback tattile per smartphone
    function vibra() {
      if ('vibrate' in navigator) navigator.vibrate(25);
    }

    // Carica i prodotti dal Google Sheet (o dal backup locale)
    async function caricaProdotti() {
      const iconSync = document.getElementById('icon-sync');
      if (iconSync) iconSync.classList.add('fa-spin');

      try {
        if (!WEB_APP_URL || WEB_APP_URL.includes("INSERISCI_QUI")) {
          throw new Error("URL Apps Script non ancora inserito. Utilizzo dati dimostrativi.");
        }

        const response = await fetch(`${WEB_APP_URL}?action=getProdotti`);
        const result = await response.json();

        if (result.status === 'success') {
          listinoProdotti = result.prodotti;
          localStorage.setItem('bar_listino_cache', JSON.stringify(listinoProdotti));
        } else {
          throw new Error(result.message || 'Errore nel recupero prodotti');
        }
      } catch (err) {
        console.warn('Errore connessione:', err.message);
        // Fallback su cache locale o dati demo
        const cache = localStorage.getItem('bar_listino_cache');
        if (cache) {
          listinoProdotti = JSON.parse(cache);
        } else {
          listinoProdotti = [
            { id: 1, nome: 'Acqua 0.5L', prezzo: 1.00, categoria: 'Bevande', icona: 'fa-bottle-water', giacenza: 50 },
            { id: 2, nome: 'Birra Spina', prezzo: 3.00, categoria: 'Bevande', icona: 'fa-beer-mug-empty', giacenza: 30 },
            { id: 3, nome: 'Bibita Lattina', prezzo: 2.00, categoria: 'Bevande', icona: 'fa-wine-bottle', giacenza: 24 },
            { id: 4, nome: 'Caffè', prezzo: 1.10, categoria: 'Bevande', icona: 'fa-mug-hot', giacenza: 100 },
            { id: 5, nome: 'Salamella', prezzo: 4.50, categoria: 'Cibo', icona: 'fa-burger', giacenza: 15 },
            { id: 6, nome: 'Hot Dog', prezzo: 3.50, categoria: 'Cibo', icona: 'fa-hotdog', giacenza: 20 },
            { id: 7, nome: 'Patatine', prezzo: 2.50, categoria: 'Cibo', icona: 'fa-cookie', giacenza: 10 },
            { id: 8, nome: 'Toast', prezzo: 3.00, categoria: 'Cibo', icona: 'fa-bread-slice', giacenza: 8 }
          ];
        }
      } finally {
        if (iconSync) iconSync.classList.remove('fa-spin');
        renderProdotti();
      }
    }

    // Rendering dell'interfaccia prodotti divisa per categoria
    function renderProdotti() {
      const container = document.getElementById('lista-prodotti');
      container.innerHTML = '';

      if (listinoProdotti.length === 0) {
        container.innerHTML = `<div class="text-center text-gray-500 py-10">Nessun prodotto disponibile</div>`;
        return;
      }

      // Raggruppa per Categoria
      const categorie = {};
      listinoProdotti.forEach(p => {
        const cat = p.categoria || 'Altro';
        if (!categorie[cat]) categorie[cat] = [];
        categorie[cat].push(p);
      });

      for (const [cat, prodotti] of Object.entries(categorie)) {
        let sectionHtml = `
          <div>
            <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 flex items-center gap-1">
              <span>${cat}</span>
            </h2>
            <div class="grid grid-cols-2 gap-2.5">
        `;

        prodotti.forEach(p => {
          const qtaInCarrello = carrello[p.nome] ? carrello[p.nome].quantita : 0;
          const giacenzaDisponibile = p.giacenza - qtaInCarrello;
          const esaurito = giacenzaDisponibile <= 0;

          sectionHtml += `
            <button 
              onclick="aggiungiProdotto('${p.nome}', ${p.prezzo}, ${p.giacenza})" 
              ${esaurito ? 'disabled' : ''}
              class="bg-white p-3 rounded-2xl shadow-sm border border-gray-200 relative text-left flex flex-col justify-between h-22 transition-all ${
                esaurito 
                  ? 'opacity-40 bg-gray-100 cursor-not-allowed border-dashed' 
                  : 'active:scale-95 active:bg-blue-50 hover:border-blue-300'
              }"
            >
              <div class="flex justify-between items-start w-full">
                <div class="flex items-center space-x-1.5 overflow-hidden pr-1">
                  <i class="fa-solid ${p.icona || 'fa-tag'} text-blue-600 text-sm shrink-0"></i>
                  <span class="font-bold text-gray-800 text-xs sm:text-sm truncate">${p.nome}</span>
                </div>
                <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-md shrink-0 ${
                  giacenzaDisponibile <= 3 ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-600'
                }">
                  Giac: ${giacenzaDisponibile}
                </span>
              </div>
              
              <div class="flex justify-between items-end w-full mt-2">
                <span class="text-blue-700 font-black text-base">€ ${p.prezzo.toFixed(2).replace('.', ',')}</span>
                ${qtaInCarrello > 0 ? `
                  <span class="bg-blue-600 text-white font-extrabold text-xs px-2 py-0.5 rounded-full shadow">
                    ${qtaInCarrello}
                  </span>
                ` : ''}
              </div>
            </button>
          `;
        });

        sectionHtml += `</div></div>`;
        container.innerHTML += sectionHtml;
      }
    }

    // Aggiunge un prodotto al carrello verificando la giacenza
    function aggiungiProdotto(nome, prezzo, giacenzaMax) {
      vibra();
      const qtaAttuale = carrello[nome] ? carrello[nome].quantita : 0;

      if (qtaAttuale >= giacenzaMax) {
        alert(`Giacenza massima raggiunta per ${nome}`);
        return;
      }

      if (carrello[nome]) {
        carrello[nome].quantita += 1;
      } else {
        carrello[nome] = { prezzo: prezzo, quantita: 1, giacenzaMax: giacenzaMax };
      }

      aggiornaUI();
    }

    // Modifica le quantità nel modal del carrello
    function modificaQuantita(nome, delta) {
      vibra();
      if (carrello[nome]) {
        carrello[nome].quantita += delta;
        if (carrello[nome].quantita <= 0) {
          delete carrello[nome];
        }
      }
      aggiornaUI();
      renderModal();

      if (Object.keys(carrello).length === 0) {
        chiudiModal();
      }
    }

    // Resetta lo scontrino corrente
    function resetCarrello() {
      vibra();
      carrello = {};
      aggiornaUI();
    }

    // Calcola il totale parziale
    function calcolaTotale() {
      return Object.values(carrello).reduce((acc, item) => acc + (item.prezzo * item.quantita), 0);
    }

    // Aggiorna i testi dell'interfaccia e della bottom bar
    function aggiornaUI() {
      const totale = calcolaTotale();
      document.getElementById('totale-display').innerText = `€ ${totale.toFixed(2).replace('.', ',')}`;
      
      const btnIncassa = document.getElementById('btn-incassa');
      btnIncassa.disabled = totale === 0;

      const anteprima = document.getElementById('anteprima-carrello');
      const chiavi = Object.keys(carrello);
      
      if (chiavi.length === 0) {
        anteprima.innerHTML = '<span class="italic text-gray-400">Nessun articolo nel carrello</span>';
      } else {
        anteprima.innerHTML = chiavi.map(k => `
          <span class="bg-blue-100 text-blue-800 border border-blue-200 px-2.5 py-1 rounded-full whitespace-nowrap font-bold text-xs flex items-center gap-1">
            <span class="text-blue-600 font-extrabold">${carrello[k].quantita}x</span> ${k}
          </span>
        `).join('');
      }

      renderProdotti();
    }

    // Apri modal cassa
    function apriCassa() {
      vibra();
      renderModal();
      const modal = document.getElementById('modal-cassa');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    // Chiudi modal cassa
    function chiudiModal() {
      const modal = document.getElementById('modal-cassa');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // Popola il modal con i dettagli dell'ordine
    function renderModal() {
      const lista = document.getElementById('dettaglio-ordine');
      const totale = calcolaTotale();
      document.getElementById('modal-totale').innerText = `€ ${totale.toFixed(2).replace('.', ',')}`;

      lista.innerHTML = Object.entries(carrello).map(([nome, item]) => `
        <div class="py-2.5 flex justify-between items-center">
          <div>
            <div class="font-bold text-gray-800 text-sm">${nome}</div>
            <div class="text-xs text-gray-500">€ ${item.prezzo.toFixed(2).replace('.', ',')} cad.</div>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="modificaQuantita('${nome}', -1)" class="w-8 h-8 bg-gray-200 hover:bg-gray-300 rounded-lg font-bold flex items-center justify-center text-gray-700 active:scale-90 transition">-</button>
            <span class="font-bold w-5 text-center text-sm">${item.quantita}</span>
            <button onclick="modificaQuantita('${nome}', 1)" class="w-8 h-8 bg-gray-200 hover:bg-gray-300 rounded-lg font-bold flex items-center justify-center text-gray-700 active:scale-90 transition">+</button>
            <span class="font-extrabold ml-2 text-gray-800 w-16 text-right">€ ${(item.prezzo * item.quantita).toFixed(2).replace('.', ',')}</span>
          </div>
        </div>
      `).join('');
    }

    // Invia l'ordine a Google Sheets e aggiorna il magazzino locale
    async function concludiOrdine() {
      vibra();
      const btnConferma = document.getElementById('btn-conferma');
      btnConferma.disabled = true;
      btnConferma.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Salvataggio...`;

      const ordine = {
        totale: calcolaTotale(),
        metodoPagamento: 'contanti',
        articoli: Object.entries(carrello).map(([nome, item]) => ({
          nome: nome,
          quantita: item.quantita,
          prezzo: item.prezzo
        }))
      };

      try {
        if (WEB_APP_URL && !WEB_APP_URL.includes("INSERISCI_QUI")) {
          await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', // Evita blocchi CORS standard di Google Apps Script
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'registraVendita', ordine: ordine })
          });
        }

        // Scala localmente le giacenze per aggiornamento visivo istantaneo
        ordine.articoli.forEach(art => {
          const p = listinoProdotti.find(prod => prod.nome === art.nome);
          if (p) p.giacenza = Math.max(0, p.giacenza - art.quantita);
        });

        // Salva stato aggiornato in cache
        localStorage.setItem('bar_listino_cache', JSON.stringify(listinoProdotti));

        chiudiModal();
        resetCarrello();
        
        // Ricarica i prodotti reali da Google Sheets dopo 1 secondo per sincronizzare
        setTimeout(caricaProdotti, 1000);

      } catch (err) {
        alert('Vendita registrata localmente (errore di connessione col foglio).');
        chiudiModal();
        resetCarrello();
      } finally {
        btnConferma.disabled = false;
        btnConferma.innerHTML = `<i class="fa-solid fa-check"></i> CONFERMA E SALVA`;
      }
    }
  </script>
</body>
</html>
